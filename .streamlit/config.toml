[theme]
base = "light"
primaryColor = "#1B2A41"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#1B2A41"
linkColor = "#1B2A41"
borderColor = "#E3E6EA"
baseRadius = "8px"
headingFontSizes = ["2.1rem", "1.5rem", "1.15rem"]
headingFontWeights = [700, 600, 600]
showWidgetBorder = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
